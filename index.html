*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);color:var(--g900);background:var(--bg);font-size:16px;line-height:1.45;letter-spacing:-.02em;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;letter-spacing:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#map{position:fixed;inset:0;z-index:0}
.leaflet-container{background:var(--bg);font-family:var(--font)}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-edge);box-shadow:var(--shadow)}

/* ── 상단: 네이버식 검색바 + 칩 ── */
.top{position:fixed;left:0;right:0;top:0;z-index:600;padding:calc(var(--sat) + 10px) 12px 0;display:grid;gap:10px;pointer-events:none}
.search{pointer-events:auto;display:flex;align-items:center;gap:10px;border-radius:16px;padding:0 6px 0 14px;height:54px}
.search .logo{width:38px;height:38px;border-radius:12px;background:var(--blue-l);display:grid;place-items:center;flex:none}
.search .logo svg{width:30px;height:30px}
.where{flex:1;min-width:0;text-align:left;display:grid;line-height:1.25}
.where b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where span{font-size:12.5px;color:var(--g600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--g700);flex:none}
.ibtn:active{background:var(--g100)}
.ibtn svg{width:21px;height:21px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;margin:0 -12px;padding:0 12px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:999px;font-size:14px;font-weight:600;color:var(--g700);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip svg{width:14px;height:14px}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--on-chip);border-color:var(--chip-on)}

.fabs{position:fixed;right:12px;z-index:550;display:grid;gap:10px;bottom:calc(var(--peek) + var(--sab) + 14px);transition:opacity .2s}
.fab{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--g800)}
.fab svg{width:21px;height:21px}
body.half .fabs,body.full .fabs{opacity:0;pointer-events:none}

/* ── 지도 라벨/마커 ── */
.lbl-gu{font-size:13px;font-weight:700;color:var(--g500);white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.lbl-dong{font-size:11px;font-weight:500;color:var(--g400);white-space:nowrap;transform:translate(-50%,-50%);text-shadow:0 0 2px var(--bg),0 0 2px var(--bg)}
.lbl-han{font-size:13px;font-weight:700;color:var(--han);white-space:nowrap;transform:translate(-50%,-50%);letter-spacing:.4em}
.mk{display:inline-flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);white-space:nowrap;transition:opacity .2s}
.mk .p{display:inline-flex;align-items:center;gap:5px;background:#fff;color:var(--g900);font-size:13px;font-weight:700;line-height:1;height:30px;padding:0 11px;border-radius:999px;box-shadow:0 2px 8px rgba(80,60,90,.18),0 0 0 1px rgba(80,60,90,.06);position:relative;font-variant-numeric:tabular-nums}
.mk .p::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;width:10px;height:10px;background:inherit;transform:rotate(45deg);border-radius:2px;box-shadow:2px 2px 3px rgba(80,60,90,.08)}
.mk .d{width:7px;height:7px;border-radius:50%;background:var(--g400)}
.mk.mine .d{background:var(--mint)}
.mk.mine .p{color:var(--green)}
.mk.sel .p{background:var(--pri);color:var(--on-pri);transform:scale(1.12);box-shadow:0 6px 16px var(--pri-shadow)}
.mk.sel .d{background:var(--on-pri)}
.mk.dim{opacity:.28}
.mk .n{display:none;margin-top:8px;font-size:11.5px;font-weight:700;color:var(--g800);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.showNames .mk .n,.mk.sel .n{display:block}
.me{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;transform:translate(-50%,-50%);box-shadow:0 0 0 11px var(--me-ring),0 3px 8px rgba(0,0,0,.2)}
.me svg{width:31px;height:31px;display:block}
.pickhint{position:fixed;left:50%;top:calc(var(--sat) + 122px);transform:translateX(-50%);z-index:650;color:var(--g900);font-size:14px;font-weight:600;padding:10px 16px;border-radius:12px;display:none;white-space:nowrap}
body.picking .pickhint{display:block}

/* ── 바텀시트: 네이버 리스트 구조 ── */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:700;border-radius:24px 24px 0 0;display:flex;flex-direction:column;height:calc(var(--peek) + var(--sab));transition:height .28s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto;background:var(--glass-sheet);-webkit-backdrop-filter:var(--blur-sheet);backdrop-filter:var(--blur-sheet);border-bottom:0;box-shadow:0 -8px 30px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.9)}
body.half .sheet{height:58%}
body.full .sheet{height:calc(100% - var(--sat) - 70px)}
.grab{flex:none;padding:8px 20px 10px;touch-action:none;cursor:pointer}
.grab .h{width:36px;height:5px;border-radius:3px;background:rgba(0,0,0,.14);margin:0 auto 12px}
.grab .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grab h2{font-size:19px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grab h2 em{font-style:normal;color:var(--accent);margin-left:4px}
.sort{font-size:13px;font-weight:600;color:var(--g600);white-space:nowrap;display:flex;align-items:center;gap:2px}
.grab .sub{font-size:12.5px;color:var(--g500);margin-top:3px}
.list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 calc(var(--sab) + 20px)}
.item{padding:16px 20px;display:grid;gap:6px;border-top:1px solid var(--line);cursor:pointer}
.item.sel{background:var(--row-sel)}
.it-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.nm{font-size:17px;font-weight:700;line-height:1.35;color:var(--g900)}
.nm .cat{font-size:13px;font-weight:500;color:var(--g500);margin-left:6px}
.tag-mine{display:inline-block;font-size:11px;font-weight:700;color:var(--green);background:var(--green-l);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.tm{text-align:right;flex:none}
.tm .v{font-size:22px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--g900)}
.tm .v small{font-size:13px;font-weight:600;color:var(--g500);margin-right:2px}
.item.sel .tm .v{color:var(--accent)}
.tm .s{font-size:12px;color:var(--g500);white-space:nowrap;margin-top:2px}
.line{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:13.5px;color:var(--g700);align-items:center}
.line .dot{width:3px;height:3px;border-radius:50%;background:var(--g300)}
.pk{font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px}
.pk.free,.pk.yes{background:var(--green-l);color:var(--green)}
.pk.paid{background:var(--orange-l);color:var(--orange)}
.pk.none{background:var(--red-l);color:var(--red)}
.pk.unk{background:var(--g100);color:var(--g600)}
.memo{font-size:14px;color:var(--g600);margin:0;line-height:1.5}
.acts{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;margin-top:6px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:46px;border-radius:14px;font-weight:700;font-size:15px;text-decoration:none}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--pri);color:var(--on-pri);font-weight:800}
.btn.pri:active{background:var(--pri-d)}
.btn.sec{background:var(--sec);color:var(--on-sec)}
.btn.sec:active{background:var(--sec-d)}
.empty{text-align:center;color:var(--g500);padding:28px 0}
.foot{font-size:12px;color:var(--g500);padding:14px 20px 0;line-height:1.5}

/* ── 출발지 시트 ── */
.mbg{position:fixed;inset:0;background:rgba(43,38,51,.32);z-index:900;display:none}
.modal{position:fixed;left:8px;right:8px;bottom:calc(var(--sab) + 8px);z-index:901;border-radius:28px;padding:22px 18px 18px;display:none;gap:14px;max-width:560px;margin:0 auto;max-height:85%;overflow:auto;background:rgba(255,255,255,.94)}
.mbg.show{display:block} .modal.show{display:grid}
.modal h3{margin:0 4px;font-size:21px;font-weight:700}
.field{display:flex;align-items:center;gap:8px;background:var(--g100);border:1px solid var(--g200);border-radius:14px;padding:0 14px;height:50px}
.field svg{width:18px;height:18px;color:var(--g500);flex:none}
.field input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--g900);outline:none}
.opts{display:grid;gap:2px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 6px;border-radius:14px;text-align:left}
.opt:active{background:var(--g100)}
.opt .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--blue-l);color:var(--accent)}
.opt .ic.g{background:var(--green-l);color:var(--green)}
.opt .ic svg{width:19px;height:19px}
.opt .tx{display:grid;gap:1px}
.opt .tx b{font-size:16px;font-weight:600;color:var(--g900)}
.opt .tx small{font-size:13px;color:var(--g500)}
.results{display:grid;gap:2px;max-height:34vh;overflow:auto}
.results button{text-align:left;padding:12px 10px;border-radius:12px;font-size:15px;font-weight:600}
.results button:active{background:var(--g100)}
.results button small{color:var(--g500);font-weight:400;margin-left:6px}
.help{font-size:12.5px;color:var(--g500);margin:0 6px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(var(--peek) + var(--sab) + 20px);transform:translateX(-50%);background:rgba(43,38,51,.92);color:#fff;font-size:14px;font-weight:500;padding:12px 18px;border-radius:14px;z-index:1000;max-width:88vw;display:none;text-align:center}
.toast.show{display:block}
.leaflet-tile-pane{filter:var(--tilef)}
.leaflet-bottom.leaflet-right{bottom:calc(var(--peek) + var(--sab))}
.leaflet-control-attribution{font-size:10px;background:var(--glass)!important}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ html[data-theme]{ --glass:rgba(255,255,255,.96); --glass-strong:#fff; --glass-sheet:rgba(255,255,255,.97); } }
.sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line),0 1px 3px rgba(0,0,0,.12);background:linear-gradient(135deg,var(--sw1) 0 50%,var(--sw2) 50% 100%)}
html[data-theme="citrus"] .sw{--sw1:#80a1d4;--sw2:#c0b9dd}
html[data-theme="lavender"] .sw{--sw1:#ff9f1c;--sw2:#2ec4b6}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

/* 차량 예상시간: 직선거리 × 도로 우회계수, 서울 시간대별 평균 속도 */
function speedNow(d){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US",{ timeZone:"Asia/Seoul", weekday:"short", hour:"numeric", hourCycle:"h23" }).formatToParts(d).map(x => [x.type, x.value]));
  const h = +p.hour, wk = p.weekday === "Sat" || p.weekday === "Sun";

  if (h >= 10 && h < 17) return { v:23, l:"평일 낮", m:1.35 };

  return { v:34, l:"심야", m:1.1 };

const TILES = [

function useTiles(ix){
  if (tileLayer){ map.removeLayer(tileLayer); tileLayer = null; }

const FAV = k => { const c = k === "lavender" ? ["%23ece9f5","%2380a1d4","%23a79ed6"] : ["%23fff1db","%232ec4b6","%23ff9f1c"]; return `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='28' fill='${c[0]}'/%3E%3Cpath d='M28 54h56v14c0 14.4-11.6 26-26 26h-4c-14.4 0-26-11.6-26-26V54z' fill='${c[1]}'/%3E%3Ccircle cx='56' cy='32' r='12' fill='${c[2]}'/%3E%3Ccircle cx='62' cy='27' r='10' fill='${c[0]}'/%3E%3C/svg%3E`; };

function match(c){
  const t = c.t, f = state.f;
  if (f.has("mine") && !c.m) return false;
  if (f.has("park") && !["free","paid","yes"].includes(c.pk)) return false;

}

});

let osrmRun = 0;
async function roadTimes(){
  const my = ++osrmRun, o = state.origin, at = state.at, sp = state.sp;
  const key = (Math.round(o.lat/0.003)*0.003).toFixed(3) + "," + (Math.round(o.lng/0.003)*0.003).toFixed(3);
  const c0 = LS.get("roadCache", null);
  let dur = null, dist = null;
  if (c0 && c0.k === key && c0.n === CAFES.length && Date.now() - c0.t < 6 * 3600000){ dur = c0.dur; dist = c0.dist; }
  else {
    const coords = [[o.lng,o.lat], ...CAFES.map(c => [c.lng, c.lat])].map(p => p[0].toFixed(5) + "," + p[1].toFixed(5)).join(";");
    for (const host of ["https://routing.openstreetmap.de/routed-car", "https://router.project-osrm.org"]){
      try{
        const r = await fetch(`${host}/table/v1/driving/${coords}?sources=0&annotations=duration,distance`);
        const d = await r.json();
        if (r.ok && d.code === "Ok"){ dur = d.durations[0].slice(1); dist = d.distances ? d.distances[0].slice(1) : []; break; }
      }catch(e){}
    }
    if (dur) LS.set("roadCache", { k:key, t:Date.now(), n:CAFES.length, dur, dist });
  }
  if (my !== osrmRun || !dur) return;
  CAFES.forEach((c,i) => {
    if (dur[i] == null) return;
    const min = Math.max(2, Math.round(dur[i] * sp.m / 60 + 1));
    state.est[i] = { km: hav(o, c), road: dist[i] != null ? dist[i] / 1000 : state.est[i].road, min };
  });
  state.road = true;
  document.getElementById("whereS").textContent = `${clock(at)} 출발 · ${sp.l} 도로 기준 차량 예상`;
  renderAll();
}
function recalc(){
  state.at = new Date(); state.sp = speedNow(state.at); state.road = false;
  CAFES.forEach((c,i) => state.est[i] = estimate(state.origin, c, state.sp));
  document.getElementById("whereT").textContent = state.label;
  document.getElementById("whereS").textContent = `${clock(state.at)} 출발 · ${state.sp.l} 기준 차량 예상`;
  renderAll();
  roadTimes();
}

  const tmap = `tmap://route?rGoName=${encodeURIComponent(c.n)}&rGoX=${c.lng}&rGoY=${c.lat}`;
  const kakao = `https://map.kakao.com/link/to/${encodeURIComponent(c.n)},${c.lat},${c.lng}`;
  const photo = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(c.n)}&query_place_id=${c.pid}`;
  const area = c.r.replace(/^부천 /, "부천 ");
  return `<article class="item ${state.sel===i?"sel":""}" data-i="${i}">
    <div class="it-top">
      <div><div class="nm">${esc(c.n)}${c.m?'<span class="tag-mine">단골</span>':""}</div>
        <div class="line"><span>카페</span><i class="dot"></i><span>${esc(area)}</span></div></div>
      <div class="tm"><div class="v"><small>약</small>${e.min}분</div><div class="s">${e.road.toFixed(1)}km · ${arr} 도착</div></div>
    </div>
    <div class="line"><span>${esc(c.h)}</span><span class="pk ${c.pk}">${PKL[c.pk]}</span></div>
    ${c.memo?`<p class="memo">${esc(c.memo)}</p>`:""}
    <div class="acts"><a class="btn pri" href="${tmap}" target="_top">${NAV_I}티맵 길안내</a><a class="btn sec" href="${photo}" target="_blank" rel="noopener">${PIC_I}내부 사진</a><a class="btn sec" href="${kakao}" target="_blank" rel="noopener">카카오맵</a></div>
  </article>`;
}
function ids(){ return CAFES.map((c,i) => i).filter(i => match(CAFES[i])).sort((a,b) => state.est[a].min - state.est[b].min || state.est[a].km - state.est[b].km); }
function renderList(){
  const list = ids(), el = document.getElementById("list"), st = el.scrollTop;
  let h = "";
  if (state.sel != null && list.includes(state.sel)) h += card(state.sel);
  h += list.filter(i => i !== state.sel).map(card).join("") || '<p class="empty">조건에 맞는 카페가 없어요</p>';
  h += `<p class="foot">이동시간은 ${state.sp.l} 평균 속도로 계산한 예상치예요. 실시간 소요시간은 티맵 길안내에서 확인할 수 있어요.</p>`;
  el.innerHTML = h; el.scrollTop = st;
  const t = document.getElementById("sheetTitle");
  t.innerHTML = state.sel != null ? esc(CAFES[state.sel].n) : `카페<em>${list.length}</em>`;
  document.getElementById("sheetSub").textContent = `${state.label}에서 ${clock(state.at)} 출발 기준`;
}
function renderAll(){ CAFES.forEach((c,i) => refreshMarker(i)); renderList(); }

/* ---------- 출발지 ---------- */
let watchId = null;
function stopGps(){ if (watchId != null && navigator.geolocation){ navigator.geolocation.clearWatch(watchId); watchId = null; } }
function startGps(manual){
  if (!("geolocation" in navigator)){ if (manual) toast("이 브라우저는 위치를 지원하지 않아요"); return; }
  stopGps();
  let first = true;
  watchId = navigator.geolocation.watchPosition(p => {
    const o = { lat:p.coords.latitude, lng:p.coords.longitude };
    if (first){ first = false; setOrigin(o, "현재 위치", true, true); return; }
    if (state.label === "현재 위치" && hav(state.origin, o) > 0.3){ state.origin = o; LS.set("origin", { o, label:"현재 위치" }); drawMe(); recalc(); }
  }, err => {
    stopGps();
    if (manual) toast(err.code === 1 ? "위치 권한이 꺼져 있어요. 브라우저 설정에서 허용해 주세요" : "위치를 찾지 못했어요");
  }, { enableHighAccuracy:true, maximumAge:30000, timeout:12000 });
}
function setOrigin(o, label, fit, keepGps){
  if (!keepGps) stopGps();
  state.origin = o; state.label = label; LS.set("origin", { o, label });
  state.sel = null; setSheet("");
  drawMe(); recalc(); if (fit !== false) fitAround();
}
function fitAround(){
  const o = state.origin;
  const near = CAFES.map(c => [c, hav(o,c)]).sort((a,b) => a[1]-b[1]).slice(0,6).map(x => [x[0].lat, x[0].lng]);
  map.fitBounds(L.latLngBounds([[o.lat,o.lng], ...near]), { paddingTopLeft:[40,150], paddingBottomRight:[70,210], maxZoom:14, animate:false });
}

/* ---------- 선택 & 시트 ---------- */
function setSheet(s){ document.body.classList.remove("half","full"); if (s) document.body.classList.add(s); }
function select(i){
  const prev = state.sel; state.sel = i;
  if (prev != null) refreshMarker(prev); refreshMarker(i);
  renderList(); document.getElementById("list").scrollTop = 0;
  if (!document.body.classList.contains("full")) setSheet("half");
  const c = CAFES[i], y = map.getSize().y, z = Math.max(map.getZoom(), 13);
  const pt = map.project([c.lat,c.lng], z).add([0, y * 0.22]);
  map.setView(map.unproject(pt, z), z);
}
const grab = document.getElementById("grab"); let sy = null;
grab.addEventListener("pointerdown", e => { sy = e.clientY; try{ grab.setPointerCapture(e.pointerId); }catch(_){} });
grab.addEventListener("pointerup", e => {
  if (sy == null) return; const dy = e.clientY - sy; sy = null;
  const cur = document.body.classList.contains("full") ? 2 : document.body.classList.contains("half") ? 1 : 0;
  const next = Math.abs(dy) < 8 ? (cur + 1) % 3 : dy < 0 ? Math.min(2, cur + 1) : Math.max(0, cur - 1);
  setSheet(["","half","full"][next]);
});
document.getElementById("list").addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const cd = e.target.closest(".item"); if (cd && +cd.dataset.i !== state.sel) select(+cd.dataset.i);
});
map.on("click", e => {
  if (document.body.classList.contains("picking")){
    document.body.classList.remove("picking");
    const near = BASE.dong.map(d => [d, hav({ lat:e.latlng.lat, lng:e.latlng.lng }, { lat:d.lp[0], lng:d.lp[1] })]).sort((a,b) => a[1]-b[1])[0];
    setOrigin({ lat:e.latlng.lat, lng:e.latlng.lng }, near ? near[0].n + " 근처" : "고른 곳", false);
    toast("출발지를 바꿨어요"); return;
  }
  if (state.sel != null){ const p = state.sel; state.sel = null; refreshMarker(p); renderList(); }
});

/* ---------- 컨트롤 ---------- */
document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  const f = b.dataset.f; state.f.has(f) ? state.f.delete(f) : state.f.add(f);
  b.setAttribute("aria-pressed", state.f.has(f));
  if (f === "names") document.body.classList.toggle("showNames", state.f.has("names"));
  renderAll();
}));
document.getElementById("refBtn").addEventListener("click", () => { recalc(); toast(`${clock(state.at)} 기준으로 다시 계산했어요`); });
document.getElementById("meBtn").addEventListener("click", fitAround);
document.getElementById("allBtn").addEventListener("click", () => map.fitBounds(bounds, { paddingTopLeft:[20,110], paddingBottomRight:[20,170] }));
const mbg = document.getElementById("mbg"), wm = document.getElementById("whereModal");
const openW = () => { wm.classList.add("show"); mbg.classList.add("show"); document.getElementById("dongQ").value = ""; document.getElementById("dongR").innerHTML = ""; };
const closeW = () => { wm.classList.remove("show"); mbg.classList.remove("show"); };
document.getElementById("whereBtn").addEventListener("click", openW);
mbg.addEventListener("click", closeW);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeW(); });
document.getElementById("useGps").addEventListener("click", () => { closeW(); startGps(true); });
document.getElementById("useHome").addEventListener("click", () => { closeW(); setOrigin({ lat:HOME.lat, lng:HOME.lng }, HOME.name); });
document.getElementById("useWork").addEventListener("click", () => { closeW(); setOrigin({ lat:WORK.lat, lng:WORK.lng }, WORK.name); });
document.getElementById("usePick").addEventListener("click", () => { closeW(); setSheet(""); document.body.classList.add("picking"); });
document.getElementById("dongQ").addEventListener("input", e => {
  const q = e.target.value.trim().replace(/\s/g, "");
  const out = q ? BASE.dong.filter(d => d.n.includes(q) || (d.g + d.n).includes(q)).slice(0, 12) : [];
  document.getElementById("dongR").innerHTML = out.map(d => `<button type="button" data-lat="${d.lp[0]}" data-lng="${d.lp[1]}" data-n="${esc(d.n)}">${esc(d.n)}<small>${esc(d.g)}</small></button>`).join("") || (q ? '<p class="help">찾는 동이 없어요</p>' : "");
});
document.getElementById("dongR").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  closeW(); setOrigin({ lat:+b.dataset.lat, lng:+b.dataset.lng }, b.dataset.n);
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - state.at.getTime() > 5 * 60000) recalc(); });
setInterval(() => { if (!document.hidden) recalc(); }, 10 * 60000);
let tT = null;
function toast(m){ const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tT); tT = setTimeout(() => t.classList.remove("show"), 2400); }

/* ---------- 시작 ---------- */
const saved = LS.get("origin", null);
if (saved && saved.o) setOrigin(saved.o, saved.label, true, true); else setOrigin({ lat:HOME.lat, lng:HOME.lng }, HOME.name, true, true);
if (!saved || saved.label === "현재 위치") startGps(false);
})();
</script>
</body>
</html>
